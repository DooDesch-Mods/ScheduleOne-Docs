name: Build and deploy docs

on:
  push:
    branches: [main]
  # The content lives in 25 other repositories, so a build with no commit here is the normal case.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  # A mod's release workflow can fire this to publish its new version immediately instead of waiting
  # for the nightly run:  gh api repos/DooDesch-Mods/ScheduleOne-Docs/dispatches -f event_type=mod-released
  repository_dispatch:
    types: [mod-released]

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_SITE: https://docs.doodesch.de
      DOCS_BASE: /
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 / @astrojs/compiler-rs needs Node >= 22.12.
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: npm ci
      - run: npm ci --prefix mcp

      # The API history walks every release tag of every mod. A tag's tree and files never change, so
      # without this the nightly run refetches ninety immutable snapshots to learn nothing new.
      - name: Restore the ingest cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ingest-${{ github.run_id }}
          restore-keys: ingest-

      # Reads the org, pulls every mod at its latest release tag, generates the reference. Needs a token
      # only for the API rate limit; every repo it touches is public.
      - name: Ingest mods and build the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build

      # A site that builds is not the same as a site that works: the per-mod pages are assembled by rule,
      # and a wrong rule produces valid HTML pointing at pages that do not exist.
      - name: Check internal links
        run: node scripts/check-links.mjs

      - name: Smoke-test the MCP server
        run: npm run smoke --prefix mcp

      # Dokploy builds the `deploy` branch, which carries the finished site plus the nginx image that
      # serves it. Force-pushing a single fresh commit keeps an artifact branch from growing forever.
      - name: Publish to the deploy branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .publish
          mkdir -p .publish
          cp -r dist .publish/site
          cp deploy/Dockerfile deploy/nginx.conf .publish/
          cd .publish
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site build from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:deploy
