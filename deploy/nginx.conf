server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every mod README is rendered as markdown, and markdown carries raw HTML through untouched. The
    # READMEs are our own, but "our own" is a trust assumption, not a control - this is the control.
    # Starlight's own scripts are bundled under /_astro, so nothing here needs inline or remote script.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Astro fingerprints everything under /_astro, so a stale copy is impossible and a year is safe.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The search index is rebuilt on every deploy and must not outlive the pages it points at.
    location /pagefind/ {
        add_header Cache-Control "public, max-age=300";
    }

    # Starlight emits a directory per page. Without the $uri/ fallback every URL but the root 404s.
    #
    # The fallback is `=404`, not `/404.html`: naming the file makes nginx serve it as an internal rewrite
    # with status 200, so every unknown URL would answer "OK" and a crawler, an agent or a link checker
    # would count a dead page as a live one. `=404` sets the real status and error_page still renders the
    # styled page.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
}
